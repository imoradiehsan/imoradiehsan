name: Deploy تحلیل‌گر بورس to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['tahlilgar/**', 'gold/**', 'bookstore/**', 'reader/**', '.github/workflows/deploy-tahlilgar.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tahlilgar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tahlilgar/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: |
          mkdir -p ../site
          cp -r dist ../site/tgb
          cp -r ../gold ../site/gold
          cp -r ../bookstore ../site/bookstore
          cp -r ../reader ../site/reader
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=tgb/"><link rel="canonical" href="tgb/"><a href="tgb/">tgb</a>' > ../site/index.html
          cp ../site/index.html ../site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
