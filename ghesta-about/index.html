<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تیم قسطا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ghesta-blue: #2160D7;
    --ghesta-gray: #B2B6BC;
    --bg: #ffffff;
    --ink: #1f2933;
    --muted: #6b7280;
    --seg-stroke: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1620;
      --ink: #eef2f6;
      --muted: #9aa5b1;
      --seg-stroke: #0e1620;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1620;
    --ink: #eef2f6;
    --muted: #9aa5b1;
    --seg-stroke: #0e1620;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Vazirmatn", system-ui, sans-serif;
  }

  /* فقط برای پیش‌نمایش: جای بقیهٔ محتوای صفحه */
  .demo-filler {
    min-height: 70vh;
    display: grid;
    place-items: center;
    padding: 0 16px;
    text-align: center;
    color: var(--muted);
  }

  /* ───────── بخش تیم → لوگو ───────── */
  .team-logo {
    position: relative;
    height: 420vh;               /* طول اسکرول انیمیشن */
  }
  .team-logo__stage {
    position: sticky;
    top: 0;
    height: 100vh;
    height: 100svh;
    overflow: hidden;
    display: grid;
    place-items: center;
  }
  .team-logo__svg {
    width: min(92vw, 86vh);
    height: min(92vw, 86vh);
    overflow: visible;
  }
  .team-logo__seg-fill { stroke: var(--seg-stroke); stroke-width: 0.6; }
  .team-logo__seg { outline: none; cursor: pointer; }
  .team-logo__intro, .team-logo__mark, .team-logo__brand { pointer-events: none; }
  .team-logo__seg-glow { fill: none; stroke: var(--ghesta-blue); pointer-events: none; }
  .team-logo__wordmark {
    font-family: "Vazirmatn", system-ui, sans-serif;
    font-weight: 800;
    fill: var(--ghesta-blue);
  }
  .team-logo__tagline {
    font-family: "Vazirmatn", system-ui, sans-serif;
    font-weight: 400;
    fill: var(--muted);
  }
  .team-logo__intro-title { font-weight: 800; fill: var(--ink); }
  .team-logo__intro-sub { fill: var(--muted); }
  .team-logo__caption {
    position: absolute;
    inset-inline: 16px;
    bottom: 5vh;
    margin: 0;
    text-align: center;
    font-size: clamp(13px, 2.2vw, 16px);
    color: var(--muted);
    transition: opacity .3s;
  }
  .team-logo__person {
    position: absolute;
    pointer-events: none;
    padding: 6px 12px;
    border-radius: 10px;
    background: var(--ink);
    color: var(--bg);
    font-size: 13px;
    line-height: 1.6;
    text-align: center;
    white-space: nowrap;
    opacity: 0;
    transform: translate(var(--tx, -50%), var(--ty, -50%)) scale(.85);
    transition: opacity .2s, transform .35s cubic-bezier(.34, 1.56, .64, 1);
  }
  .team-logo__person.is-on {
    opacity: 1;
    transform: translate(var(--tx, -50%), var(--ty, -50%)) scale(1);
  }
  .team-logo__person small { display: block; opacity: .75; }
</style>
</head>
<body>

<div class="demo-filler"><p>بالای صفحهٔ «درباره ما»<br>به پایین اسکرول کنید ↓</p></div>

<section class="team-logo" id="team-logo" aria-label="تیم قسطا">
  <div class="team-logo__stage">
    <svg class="team-logo__svg" viewBox="-100 -100 200 200" role="img" aria-label="عکس‌های تیم قسطا که به لوگوی قسطا تبدیل می‌شوند">
      <defs></defs>
      <g class="team-logo__intro">
        <text class="team-logo__intro-title" text-anchor="middle" y="-2" font-size="10">تیم قسطا</text>
        <text class="team-logo__intro-sub" text-anchor="middle" y="9" font-size="3.8">۵۰ نفر، هر کدوم یه تکه از قسطا</text>
      </g>
      <g class="team-logo__ring"></g>
      <!-- لوگوی دقیق قسطا از فایل لوتی (مرکز ۰، شعاع بیرونی ۲۰۰) -->
      <g class="team-logo__mark" opacity="0" stroke-width="32.99" stroke-linejoin="round">
        <g fill="var(--ghesta-blue)" stroke="var(--ghesta-blue)">
          <path d="M88.15 135.74A161.856 161.856 0 0 1 -88.15 -135.74" fill="none" stroke-width="76.29" stroke-linejoin="miter"/>
          <path d="M-125.03 -134.32C-110.88 -147.5 -94.73 -158.34 -77.2 -166.47L-48.81 -160.71L-55.65 -128.69C-68.21 -123.27 -79.9 -116.03 -90.35 -107.22Z"/>
          <path d="M131.89 127.59C111.82 148.32 87.17 164.04 59.9 173.45L52.25 130.1C68.37 123.63 83.15 114.22 95.84 102.34Z"/>
        </g>
        <g fill="var(--ghesta-gray)" stroke="var(--ghesta-gray)">
          <path d="M6.57 -183.39C34.32 -182.4 61.48 -175.11 86.01 -162.1L59.52 -126.95C44.53 -133.97 28.42 -138.29 11.93 -139.7Z"/>
          <path d="M132.11 -127.36C151.38 -107.37 165.87 -83.26 174.47 -56.86L131 -49.97C125.1 -65.43 116.52 -79.74 105.63 -92.21Z"/>
          <path d="M183.5 0.16C183.48 27.93 177.15 55.33 165 80.3L128.95 55.05C135.44 39.83 139.2 23.58 140.03 7.05Z"/>
        </g>
      </g>
      <g class="team-logo__brand" opacity="0">
        <text class="team-logo__wordmark" text-anchor="middle" font-size="22">قسطا</text>
        <text class="team-logo__tagline" text-anchor="middle" font-size="6">تکه‌تکه، کنار هم؛ یک قسطا</text>
      </g>
    </svg>
    <div class="team-logo__person" role="status"></div>
    <p class="team-logo__caption">اسکرول کنید</p>
  </div>
</section>

<div class="demo-filler"><p>ادامهٔ محتوای صفحهٔ «درباره ما»</p></div>

<script>
(() => {
  /*
   * عکس‌های جمعی تیم‌ها: ۸ تکه، به ترتیب ساعتگرد از پایینِ سمت راست.
   * پنج‌تای اول بخش آبی لوگو می‌شوند و سه‌تای آخر تکه‌های خاکستری.
   * برای عکس واقعی، photo را آدرس فایل بگذارید (مثلاً "team/tech.jpg").
   * align تعیین می‌کند کدام قسمت عکس داخل تکه دیده شود؛ برای عکس‌های
   * جمعی معمولاً "xMidYMin" (بالای عکس، جایی که صورت‌ها هستند) بهتر است.
   */
  const TEAMS = [
    { name: "تیم فنی",              members: 8, photo: null, align: "xMidYMid" },
    { name: "تیم محصول و طراحی",    members: 7, photo: null, align: "xMidYMid" },
    { name: "تیم اعتبارسنجی",       members: 7, photo: null, align: "xMidYMid" },
    { name: "تیم پشتیبانی",         members: 6, photo: null, align: "xMidYMid" },
    { name: "تیم فروش و همکاری‌ها", members: 6, photo: null, align: "xMidYMid" },
    { name: "تیم مالی",             members: 6, photo: null, align: "xMidYMid" },
    { name: "تیم بازاریابی",        members: 5, photo: null, align: "xMidYMid" },
    { name: "مدیریت و عملیات",      members: 5, photo: null, align: "xMidYMid" },
  ];

  /*
   * هندسهٔ لوگو، برگرفته از فایل لوتی لوگوی اصلی (واحد: شعاع بیرونی = ۲۰۰).
   * لبه‌های هر تکه موازی‌اند (فاصلهٔ بین تکه‌ها عرض ثابت دارد) و هر فاصله
   * حول یک خط شعاعی است: خاکستری‌ها بین ۲۶۳°، ۳۰۷°، ۳۵۱° و ۳۵°.
   * بخش آبی از ۳۵° تا ابتدای سرِ کمان است.
   */
  const COUNT = 8, BLUE_COUNT = 5;
  const BLUE = "#2160D7", GRAY = "#B2B6BC";
  const LOGO = { inner: 123.72 / 200, corner: 16.495 / 200, halfGap: 12.365 / 200 };
  const BLUE_STEP = (258.5 - 35) / BLUE_COUNT;
  // لبهٔ شروع و پایان هر تکه در لوگوی نهایی (زاویهٔ خط وسط فاصله)
  const FINAL_EDGES = [
    ...Array.from({ length: BLUE_COUNT }, (_, i) => [35 + i * BLUE_STEP, 35 + (i + 1) * BLUE_STEP]),
    [263, 307], [307, 351], [351, 395],
  ];
  FINAL_EDGES[BLUE_COUNT - 1][1] = 254;   // سرِ کمان کمی کوتاه‌تر است؛ لوگوی دقیق رویش می‌نشیند
  // حالت اول (حلقهٔ عکس‌ها): تکه‌های هم‌اندازه با گام ۴۵ درجه
  const START_EDGES = Array.from({ length: COUNT }, (_, i) => [35 + i * 45, 80 + i * 45]);

  const svg = document.querySelector(".team-logo__svg");
  const defs = svg.querySelector("defs");
  const ring = svg.querySelector(".team-logo__ring");
  const intro = svg.querySelector(".team-logo__intro");
  const brand = svg.querySelector(".team-logo__brand");
  const mark = svg.querySelector(".team-logo__mark");
  const wordmark = brand.querySelector(".team-logo__wordmark");
  const tagline = brand.querySelector(".team-logo__tagline");
  const section = document.getElementById("team-logo");
  const caption = section.querySelector(".team-logo__caption");
  const personTip = section.querySelector(".team-logo__person");
  const NS = "http://www.w3.org/2000/svg";

  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const phase = (p, a, b) => ease(clamp((p - a) / (b - a)));
  const toFa = n => n.toLocaleString("fa-IR");
  const rad = d => d * Math.PI / 180;
  const pt = (r, deg) => [r * Math.cos(rad(deg)), r * Math.sin(rad(deg))];

  // عکس جمعی جایگزین تا وقتی عکس واقعی نیست: چند آدم کنار هم در دو ردیف
  const placeholder = (i, members) => {
    const hue = (200 + i * 37) % 360;
    const back = Math.min(4, Math.ceil(members / 2)), front = Math.min(4, members - back) || 1;
    const person = (x, y, r, shade) =>
      `<circle cx="${x}" cy="${y}" r="${r}" fill="hsl(${hue} 30% ${shade}%)"/>` +
      `<path d="M${x - r * 2} ${y + r * 4.2}c0-${r * 1.6} ${r * .9}-${r * 2.6} ${r * 2}-${r * 2.6}s${r * 2} ${r} ${r * 2} ${r * 2.6}z" fill="hsl(${hue} 30% ${shade}%)"/>`;
    const row = (n, y, r, shade) => Array.from({ length: n }, (_, k) =>
      person(50 + (k - (n - 1) / 2) * r * 3.1, y, r, shade)).join("");
    const s = `<svg xmlns="${NS}" viewBox="0 0 100 100">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="hsl(${hue} 45% 78%)"/><stop offset="1" stop-color="hsl(${hue} 40% 58%)"/>
      </linearGradient></defs>
      <rect width="100" height="100" fill="url(#g)"/>
      ${row(back, 40, 7, 86)}${row(front, 58, 8, 95)}
    </svg>`;
    return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(s);
  };

  /*
   * مسیر یک تکهٔ حلقه، مثل تکه‌های لوگو: لبه‌ها موازی با خط شعاعیِ وسط فاصله
   * (ga و gb) با فاصلهٔ ha و hb از آن، و گوشه‌های گرد با شعاع rca و rcb.
   * برای چسبیدن تکه‌های آبی، فاصله منفی و گردیِ لبهٔ مشترک صفر می‌شود.
   */
  function segPath(r0, r1, ga, ha, rca, gb, hb, rcb) {
    const corner = (g, side, h, rc, R, outer) => {
      const u = [Math.cos(rad(g)), Math.sin(rad(g))], n = [-u[1], u[0]];
      const off = side * (h + rc), Rc = outer ? R - rc : R + rc;
      const t = Math.sqrt(Math.max(0, Rc * Rc - (h + rc) * (h + rc)));
      const C = [off * n[0] + t * u[0], off * n[1] + t * u[1]];
      const len = Math.hypot(C[0], C[1]) || 1;
      return { C, rc, line: [C[0] - side * rc * n[0], C[1] - side * rc * n[1]], circ: [C[0] / len * R, C[1] / len * R] };
    };
    const f = n => n.toFixed(3);
    const P = q => `${f(q[0])} ${f(q[1])}`;
    const fillet = (c, from, to) => {
      const cross = (from[0] - c.C[0]) * (to[1] - c.C[1]) - (from[1] - c.C[1]) * (to[0] - c.C[0]);
      return `A${f(c.rc)} ${f(c.rc)} 0 0 ${cross > 0 ? 1 : 0} ${P(to)}`;
    };
    const Ao = corner(ga, 1, ha, rca, r1, true), Bo = corner(gb, -1, hb, rcb, r1, true);
    const Bi = corner(gb, -1, hb, rcb, r0, false), Ai = corner(ga, 1, ha, rca, r0, false);
    const angle = q => Math.atan2(q[1], q[0]) * 180 / Math.PI;
    const span = ((angle(Bo.circ) - angle(Ao.circ)) % 360 + 360) % 360;
    const large = span > 180 ? 1 : 0;
    return `M${P(Ao.circ)}A${f(r1)} ${f(r1)} 0 ${large} 1 ${P(Bo.circ)}` +
      fillet(Bo, Bo.circ, Bo.line) + `L${P(Bi.line)}` + fillet(Bi, Bi.line, Bi.circ) +
      `A${f(r0)} ${f(r0)} 0 ${large} 0 ${P(Ai.circ)}` +
      fillet(Ai, Ai.circ, Ai.line) + `L${P(Ao.line)}` + fillet(Ao, Ao.line, Ao.circ) + "Z";
  }

  // ساخت المان‌ها
  const segs = TEAMS.slice(0, COUNT).map((team, i) => {
    const clip = document.createElementNS(NS, "clipPath");
    clip.id = `team-seg-clip-${i}`;
    const clipPath = document.createElementNS(NS, "path");
    clip.appendChild(clipPath);
    defs.appendChild(clip);

    const g = document.createElementNS(NS, "g");
    g.setAttribute("class", "team-logo__seg");
    g.setAttribute("tabindex", "0");
    g.setAttribute("aria-label", `${team.name}، ${toFa(team.members)} نفر`);
    const fill = document.createElementNS(NS, "path");
    fill.setAttribute("class", "team-logo__seg-fill");
    const img = document.createElementNS(NS, "image");
    img.setAttribute("href", team.photo || placeholder(i, team.members));
    img.setAttribute("preserveAspectRatio", `${team.align || "xMidYMid"} slice`);
    img.setAttribute("clip-path", `url(#${clip.id})`);
    const glow = document.createElementNS(NS, "path");
    glow.setAttribute("class", "team-logo__seg-glow");
    g.append(fill, img, glow);
    ring.appendChild(g);

    const on = () => { hovered = i; };
    const off = () => { if (hovered === i) hovered = -1; };
    g.addEventListener("pointerenter", on);
    g.addEventListener("pointerleave", off);
    g.addEventListener("focus", on);
    g.addEventListener("blur", off);
    // h: میزان هاور این تکه (۰ تا ۱) که نرم به سمت هدف حرکت می‌کند
    return { team, clipPath, fill, img, glow, g, blue: i < BLUE_COUNT, h: 0 };
  });
  let hovered = -1;

  // نرم کردن حالت هاور هر تکه؛ اگر هنوز در حال حرکت باشد true برمی‌گرداند
  function stepHover() {
    let moving = false;
    segs.forEach((s, i) => {
      const goal = i === hovered ? 1 : 0;
      s.h = reduceMotion ? goal : lerp(s.h, goal, 0.16);
      if (Math.abs(s.h - goal) < 0.002) s.h = goal; else moving = true;
    });
    return moving;
  }

  function render(p) {
    // مراحل انیمیشن بر اساس پیشرفت اسکرول (۰ تا ۱)
    const shrink = phase(p, 0.10, 0.62);   // کوچک شدن حلقه و نازک شدن تکه‌ها
    const photos = phase(p, 0.38, 0.62);   // محو شدن عکس‌ها
    const tint = clamp((p - 0.50) / 0.18); // آبی شدن تکه‌ها، یکی‌یکی
    const merge = phase(p, 0.66, 0.84);    // به‌هم‌پیوستن تکه‌های آبی
    const reveal = phase(p, 0.82, 0.96);   // نمایش نام قسطا

    const maxHover = Math.max(...segs.map(s => s.h));
    const r1 = lerp(98, 46, shrink);
    const r0 = r1 * lerp(0.40, LOGO.inner, shrink);
    const rc = r1 * lerp(0.06, LOGO.corner, shrink);
    const halfGap = r1 * lerp(0.02, LOGO.halfGap, shrink);
    const spin = lerp(-60, 0, shrink);
    const cy = lerp(0, -22, reveal);
    // لوگوی دقیق در پایان روی تکه‌ها می‌نشیند
    const exact = phase(p, 0.80, 0.90);
    mark.setAttribute("transform", `translate(0 ${cy.toFixed(2)}) scale(${(r1 / 200).toFixed(4)})`);
    mark.setAttribute("opacity", exact.toFixed(3));
    ring.style.visibility = exact >= 1 ? "hidden" : "";

    ring.setAttribute("transform", `translate(0 ${cy.toFixed(2)})`);
    intro.setAttribute("opacity", (1 - phase(p, 0.04, 0.22)).toFixed(3));

    segs.forEach((s, i) => {
      const ga = lerp(START_EDGES[i][0], FINAL_EDGES[i][0], shrink) + spin;
      const gb = lerp(START_EDGES[i][1], FINAL_EDGES[i][1], shrink) + spin;
      const center = (ga + gb) / 2;
      let ha = halfGap, hb = halfGap, rca = rc, rcb = rc;
      if (s.blue) {
        // لبه‌های داخلی بخش آبی بسته می‌شوند (با کمی هم‌پوشانی تا درز دیده نشود)
        const closed = -0.4;
        if (i > 0)              { ha = lerp(ha, closed, merge); rca = rc * (1 - merge); }
        if (i < BLUE_COUNT - 1) { hb = lerp(hb, closed, merge); rcb = rc * (1 - merge); }
      }
      // هاور: تکه کمی بزرگ‌تر و به بیرون می‌آید، تا وقتی عکس‌ها پیدا هستند
      const ho = ease(s.h) * (1 - photos);
      const grow = 4 * ho;
      const d = segPath(r0 - grow * 0.4, r1 + grow, ga - ho, ha, rca, gb + ho, hb, rcb);
      s.fill.setAttribute("d", d);
      s.clipPath.setAttribute("d", d);
      s.glow.setAttribute("d", d);
      s.glow.setAttribute("stroke-width", (1.6 * ho).toFixed(3));
      s.glow.setAttribute("opacity", ho.toFixed(3));
      const [ox, oy] = pt(5 * ho, center);
      s.g.setAttribute("transform", `translate(${ox.toFixed(2)} ${oy.toFixed(2)})`);
      // بقیهٔ تکه‌ها کمی کم‌رنگ و خاکستری می‌شوند
      const dim = clamp(maxHover - s.h) * (1 - photos);
      s.g.style.opacity = (1 - 0.3 * dim).toFixed(3);
      s.g.style.filter = dim > 0.01 ? `grayscale(${(0.7 * dim).toFixed(2)})` : "";

      const tintI = s.blue ? clamp(tint * BLUE_COUNT - (BLUE_COUNT - 1 - i) * 0.6) : 0;
      s.fill.setAttribute("fill", mix(GRAY, BLUE, ease(clamp(tintI))));
      s.fill.style.strokeOpacity = (1 - merge).toFixed(3);

      // عکس، صاف و رو به بیننده، روی مرکز تکه
      const [mx, my] = pt((r0 + r1) / 2, center);
      // عکس هنگام هاور کمی زوم می‌شود
      const size = Math.max(r1 - r0, rad(gb - ga) * r1) * (1.05 + 0.18 * ho);
      s.img.setAttribute("x", (mx - size / 2).toFixed(2));
      s.img.setAttribute("y", (my - size / 2).toFixed(2));
      s.img.setAttribute("width", size.toFixed(2));
      s.img.setAttribute("height", size.toFixed(2));
      s.img.setAttribute("opacity", (1 - photos).toFixed(3));
      s.img.style.display = photos >= 1 ? "none" : "";
      const [ex, ey] = pt(r1 + 9, center);
      s.edge = [ex + ox, ey + oy + cy];
      s.angle = center;
    });

    brand.setAttribute("opacity", reveal.toFixed(3));
    wordmark.setAttribute("y", lerp(52, 46, reveal).toFixed(2));
    tagline.setAttribute("y", lerp(64, 58, reveal).toFixed(2));

    caption.textContent = p < 0.5 ? "اسکرول کنید" : "";
    caption.style.opacity = p < 0.05 ? 1 : 1 - phase(p, 0.05, 0.2);

    // نام و سمت همکار هنگام هاور، تا وقتی عکس‌ها پیدا هستند
    if (hovered >= 0 && photos < 0.5) {
      const s = segs[hovered];
      const box = svg.getBoundingClientRect();
      const stage = section.querySelector(".team-logo__stage").getBoundingClientRect();
      const k = box.width / 200;
      personTip.innerHTML = `${s.team.name}<small>${toFa(s.team.members)} نفر</small>`;
      // کارت اسم بیرونِ تکه، در امتداد زاویه‌اش
      const [cx, cyy] = pt(1, s.angle);
      // داخل کادر نگه داشتن کارت در لبه‌های صفحه
      const tw = personTip.offsetWidth + 16, th = personTip.offsetHeight + 16;
      const tipX = clamp(box.left - stage.left + (s.edge[0] + 100) * k, tw, stage.width - tw);
      const tipY = clamp(box.top - stage.top + (s.edge[1] + 100) * k, th, stage.height - th);
      personTip.style.left = `${tipX}px`;
      personTip.style.top = `${tipY}px`;
      personTip.style.setProperty("--tx", `${(-50 + cx * 50).toFixed(1)}%`);
      personTip.style.setProperty("--ty", `${(-50 + cyy * 50).toFixed(1)}%`);
      personTip.classList.add("is-on");
    } else {
      personTip.classList.remove("is-on");
    }
  }

  function mix(a, b, t) {
    const pa = a.match(/\w\w/g).map(h => parseInt(h, 16));
    const pb = b.match(/\w\w/g).map(h => parseInt(h, 16));
    return "rgb(" + pa.map((v, k) => Math.round(lerp(v, pb[k], t))).join(",") + ")";
  }

  // پیشرفت اسکرول با کمی نرمی، تا حرکت «آروم آروم» باشد
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let target = 0, current = 0, last = -1;
  function readScroll() {
    const rect = section.getBoundingClientRect();
    const total = rect.height - innerHeight;
    target = clamp(-rect.top / total);
  }
  function tick() {
    current = reduceMotion ? target : lerp(current, target, 0.09);
    if (Math.abs(current - target) < 0.0005) current = target;
    const hoverMoving = stepHover();
    if (current !== last || hoverMoving || hovered >= 0) { render(current); last = current; }
    requestAnimationFrame(tick);
  }
  addEventListener("scroll", readScroll, { passive: true });
  addEventListener("resize", readScroll);
  readScroll(); current = target; render(current);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
