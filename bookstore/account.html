<body data-page="account">
  <div id="site-header"></div>

  <main id="main">
    <div class="container">
      <nav class="breadcrumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg><span aria-current="page">My account</span></nav>
      <div class="account">
        <aside class="acc-side" aria-label="Account navigation">
          <div class="acc-user"><span class="avatar" style="background:var(--navy-800)">JR</span><div><strong>Jane Reader</strong><span>Member since 2021</span></div></div>
          <nav class="acc-nav" id="acc-nav" role="tablist">
            <button role="tab" data-acc="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>Profile</button>

            <button role="tab" data-acc="wishlist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20s-7.5-4.6-9.3-9.2C1.4 7.4 3.6 4 7 4c2 0 3.3 1 5 3 1.7-2 3-3 5-3 3.4 0 5.6 3.4 4.3 6.8C19.5 15.4 12 20 12 20Z"/></svg>Wishlist<span class="n" id="acc-wish-n">0</span></button>

          </nav>
        </aside>
        <section class="acc-panel" id="acc-panel" role="tabpanel" aria-live="polite"></section>
      </div>
    </div>

  <div id="site-footer"></div>
