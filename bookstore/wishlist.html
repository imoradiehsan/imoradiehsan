<body data-page="wishlist">
  <div id="site-header"></div>

  <main id="main">

      <div class="wish-toolbar">
        <div><h1 style="font-size:var(--fs-3xl)" data-i18n="w.title">My Wishlist</h1><p class="muted mt-2" id="wish-count" aria-live="polite"></p></div>
        <div class="row">
          <button class="btn btn--outline" id="wish-share"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg> <span data-i18n="w.share">Share list</span></button>

          <div class="section-head__text"><span class="eyebrow" data-i18n="w.recEy">Readers also saved</span><h2 id="wr-title" data-i18n="w.recT">More books you'll love</h2></div>

            <button class="carousel__btn" data-prev aria-label="Previous" data-i18n-attr="aria-label:prev"><svg class="dir-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 6-6 6 6 6"/></svg></button>

          </div>
        </div>
        <div class="carousel__track" id="wish-reco" tabindex="0" aria-label="Recommended books" data-i18n-attr="aria-label:w.recT"></div>
        <div class="carousel__progress" aria-hidden="true"><span></span></div>
      </div>
    </section>
