<title>Logo Loader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f2f4f8;
  --blue: #0b57a4;
  --gray: #a6a9ae;
  --ink: #5a6372;
  --line: #dce1e9;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d121b;
    --blue: #3a86d6;
    --gray: #858c97;
    --ink: #9aa3b1;
    --line: #232b38;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d121b;
  --blue: #3a86d6;
  --gray: #858c97;
  --ink: #9aa3b1;
  --line: #232b38;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Vazirmatn", system-ui, sans-serif;
  display: grid;
  place-items: center;
  padding-inline: 16px;
}
main {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 56px;
}
#logo {
  width: min(260px, 64vw);
  height: auto;
  overflow: visible;
}
.p { stroke-width: 32; stroke-linejoin: round; }
.b { fill: var(--blue); stroke: var(--blue); }
.g { fill: var(--gray); stroke: var(--gray); }

.ctrl {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 13px;
  padding: 8px 16px;
  border: 1px solid var(--line);
  border-radius: 999px;
}
.ctrl input { accent-color: var(--blue); width: 140px; }
.ctrl input:focus-visible { outline: 2px solid var(--blue); outline-offset: 4px; }
.ctrl output { font-variant-numeric: tabular-nums; min-width: 4.5em; }
</style>

<main>
  <svg id="logo" viewBox="0 0 500 500" role="img" aria-label="در حال بارگذاری">
    <g id="all">
      <path id="s0" class="p g"></path>
      <path id="s1" class="p g"></path>
      <path id="s2" class="p g"></path>
      <path id="blue" class="p b"></path>
    </g>
  </svg>

  <div class="ctrl" dir="rtl">
    <label for="dur">مدت هر دور</label>
    <input id="dur" type="range" min="2" max="6" step="0.1" value="3.4">
    <output id="durOut" for="dur">۳٫۴ ثانیه</output>
  </div>
</main>

<script>
const C = 250, RO = 194, RI = 120, CR = 16, GAP = 24;
const D = GAP / 2 + CR, ro = RO - CR, ri = RI + CR;
const toRad = d => d * Math.PI / 180, toDeg = r => r * 180 / Math.PI;
const oOff = toDeg(Math.asin(D / ro)), iOff = toDeg(Math.asin(D / ri));

const BLUE = [125, 353];
const SEGS = [[353, 397], [397, 441], [441, 485]];

const P = (r, a) => {
  const t = toRad(a - 90);
  return (C + r * Math.cos(t)).toFixed(2) + " " + (C + r * Math.sin(t)).toFixed(2);
};

// Annular sector between two cut lines; constant-width gaps and rounded corners
// come from insetting by D and stroking with a round join of width 2*CR.
function sector(a, b) {
  const oa = a + oOff, ob = b - oOff, ia = a + iOff, ib = b - iOff;
  const lo = ob - oa > 180 ? 1 : 0, li = ib - ia > 180 ? 1 : 0;
  return `M${P(ro, oa)}A${ro} ${ro} 0 ${lo} 1 ${P(ro, ob)}L${P(ri, ib)}A${ri} ${ri} 0 ${li} 0 ${P(ri, ia)}Z`;
}

const clamp = x => x < 0 ? 0 : x > 1 ? 1 : x;
const span = (t, a, b) => clamp((t - a) / (b - a));
const inOut = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const outBack = x => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const inCubic = x => x * x * x;

const $ = id => document.getElementById(id);
const blue = $("blue");
const segEls = [$("s0"), $("s1"), $("s2")];
const SEG_IN = [[0.62, 0.74], [0.67, 0.79], [0.72, 0.84]];
const MID_R = (RO + RI) / 2;

// p in [0,1): the full logo at p=0 and p→1 makes the loop seamless.
function render(p) {
  // Head leads the tail, so the arc stretches over the segments while it turns.
  const t = span(p, 0, 0.70);
  const headRot = 360 * inOut(clamp(t / 0.9));
  const tailRot = 360 * inOut(clamp((t - 0.1) / 0.9));
  blue.setAttribute("d", sector(BLUE[0] + tailRot, BLUE[1] + headRot));

  SEGS.forEach(([a, b], i) => {
    const swallowed = span(headRot, a - BLUE[1], a - BLUE[1] + 30);
    const inP = span(p, ...SEG_IN[i]);
    let sc, o;
    if (p < 0.5) { const e = inCubic(swallowed); sc = 1 - 0.55 * e; o = 1 - e; }
    else { sc = 0.45 + 0.55 * outBack(inP); o = clamp(inP * 1.8); }
    const [cx, cy] = P(MID_R, (a + b) / 2).split(" ");
    const el = segEls[i];
    el.setAttribute("d", sector(a, b));
    el.setAttribute("transform", `translate(${cx} ${cy}) scale(${sc.toFixed(4)}) translate(${-cx} ${-cy})`);
    el.style.opacity = o;
  });

}

const durInput = $("dur"), durOut = $("durOut");
const fa = n => n.toFixed(1).replace(".", "٫").replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);
let duration = parseFloat(durInput.value);
durInput.addEventListener("input", () => {
  duration = parseFloat(durInput.value);
  durOut.textContent = fa(duration) + " ثانیه";
});

const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
if (reduce) {
  render(0.58);
} else {
  let phase = 0, last = null;
  const frame = now => {
    if (last !== null) phase = (phase + Math.min(now - last, 100) / 1000 / duration) % 1;
    last = now;
    render(phase);
    requestAnimationFrame(frame);
  };
  render(0);
  requestAnimationFrame(frame);
}
</script>
