<title>Logo Loader</title>
<style>
:root {
  --bg: #edf1f7;
  --blue: #1a5daa;
  --seg-1: #7a8a9e;
  --seg-2: #969fae;
  --seg-3: #b0b8c4;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1220;
    --blue: #2e7fd4;
    --seg-1: #6e7f95;
    --seg-2: #8a99ad;
    --seg-3: #a6b1be;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1220;
  --blue: #2e7fd4;
  --seg-1: #6e7f95;
  --seg-2: #8a99ad;
  --seg-3: #a6b1be;
  color-scheme: dark;
}

body {
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding-inline: 16px;
}

.spinner {
  width: 180px;
  height: 180px;
  animation: spin 1.5s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.seg-1 { animation: pulse 1.5s ease-in-out infinite; }
.seg-2 { animation: pulse 1.5s ease-in-out 0.14s infinite; }
.seg-3 { animation: pulse 1.5s ease-in-out 0.28s infinite; }

@keyframes pulse {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 1; }
}

@media (prefers-reduced-motion: reduce) {
  .spinner { animation-duration: 6s; }
  .seg-1, .seg-2, .seg-3 { animation: none; opacity: 0.7; }
}
</style>

<svg class="spinner" viewBox="0 0 200 200">
  <!-- Blue C-arc: ~250deg visible, ~110deg gap -->
  <circle cx="100" cy="100" r="70" fill="none"
    stroke="var(--blue)" stroke-width="22" stroke-linecap="round"
    stroke-dasharray="305 135" stroke-dashoffset="18"/>

  <!-- Three gray segments in the gap -->
  <rect class="seg-1" x="156" y="89" width="18" height="22" rx="6"
    fill="var(--seg-1)" transform="rotate(255, 100, 100)"/>
  <rect class="seg-2" x="156" y="89" width="18" height="22" rx="6"
    fill="var(--seg-2)" transform="rotate(290, 100, 100)"/>
  <rect class="seg-3" x="156" y="89" width="18" height="22" rx="6"
    fill="var(--seg-3)" transform="rotate(322, 100, 100)"/>
</svg>
