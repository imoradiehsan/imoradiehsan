<title>Logo Loader</title>
<style>
:root {
  --bg: #1e1e1e;
  --ink: #8a8f98;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 12px ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  display: grid;
  place-items: center;
  padding-inline: 16px;
}
main {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 48px;
}
.hero { width: min(280px, 70vw); height: auto; }
.sizes {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: flex-end;
  gap: 32px;
}
figure {
  margin: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
</style>

<main>
  <img class="hero" src="logo-loader.svg" alt="Loading">
  <div class="sizes">
    <figure><img src="logo-loader.svg" width="24" height="24" alt=""><figcaption>24px</figcaption></figure>
    <figure><img src="logo-loader.svg" width="48" height="48" alt=""><figcaption>48px</figcaption></figure>
    <figure><img src="logo-loader.svg" width="96" height="96" alt=""><figcaption>96px</figcaption></figure>
  </div>
</main>
