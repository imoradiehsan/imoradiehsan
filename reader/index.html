<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ورق</title>
  <meta name="description" content="کتاب‌خوان ورق در موکاپ آیفون.">
  <link rel="icon" href="assets/icon-192.png">
  <script>/* on a real phone there is no mockup: open the app itself, full screen */
    if (innerWidth < 700 || matchMedia('(pointer: coarse)').matches && innerWidth < 1000) location.replace('app.html' + location.hash);</script>
  <style>
    @font-face { font-family: "Vazirmatn"; src: url("assets/fonts/Vazirmatn-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
    :root { --bg: #140a26; --violet: #8b5cf6; --violet-300: #c4b5fd; --pink: #f0abfc; --text: #f4edff; --muted: #b9a7e0; --card: rgba(255,255,255,.06); --line: rgba(255,255,255,.12); }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Vazirmatn", system-ui, sans-serif; color: var(--text); background: radial-gradient(1000px 600px at 85% -10%, #5b2a86, transparent 60%), radial-gradient(800px 600px at -10% 90%, #3b1f74, transparent 55%), linear-gradient(160deg, #1a0b2e, var(--bg)); background-attachment: fixed; min-height: 100vh; -webkit-font-smoothing: antialiased; }
    .wrap { min-height: 100vh; display: grid; place-items: center; padding: 16px; }

    /* ---- iPhone mockup ---- */
    .stage { display: grid; place-items: center; }
    .phone { position: relative; width: 393px; height: 852px; border-radius: 58px; background: #0b0613; box-shadow: 0 0 0 11px #1b1326, 0 0 0 13px #3a2d4d, 0 50px 90px -30px rgba(0,0,0,.9), inset 0 0 0 2px #0b0613; overflow: hidden; }
    .phone::before { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 30px rgba(255,255,255,.04); pointer-events: none; z-index: 5; }
    .island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 125px; height: 36px; border-radius: 20px; background: #000; z-index: 6; }
    .island::after { content: ""; position: absolute; right: 14px; top: 12px; width: 12px; height: 12px; border-radius: 50%; background: #1a1130; box-shadow: inset 0 0 0 3px #0a0612; }
    .status { position: absolute; top: 0; inset-inline: 0; height: 54px; z-index: 6; display: flex; justify-content: space-between; align-items: center; padding: 10px 34px 0; font-weight: 700; font-size: 16px; color: #fff; pointer-events: none; font-family: -apple-system, "SF Pro Text", Inter, "Vazirmatn", sans-serif; direction: ltr; }
    .status svg { height: 13px; width: auto; display: block; }
    .status .right { display: flex; align-items: center; gap: 7px; }
    .phone iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #1a0b2e; }
    .btn { position: absolute; width: 4px; background: #3a2d4d; border-radius: 2px; }
    .btn.mute { left: -15px; top: 170px; height: 34px; } .btn.vup { left: -15px; top: 230px; height: 68px; } .btn.vdn { left: -15px; top: 310px; height: 68px; } .btn.pwr { right: -15px; top: 260px; height: 100px; }
    .phone-scale { transform-origin: top center; height: 852px; }

  </style>
</head>
<body>
  <div class="wrap">
    <div class="stage">
      <div class="phone-scale">
        <div class="phone">
          <div class="btn mute"></div><div class="btn vup"></div><div class="btn vdn"></div><div class="btn pwr"></div>
          <div class="island"></div>
          <div class="status">
            <span id="clock">9:41</span>
            <span class="right">
              <svg viewBox="0 0 20 13" fill="#fff"><rect x="0" y="9" width="3" height="4" rx=".8"/><rect x="4.5" y="6.5" width="3" height="6.5" rx=".8"/><rect x="9" y="4" width="3" height="9" rx=".8"/><rect x="13.5" y="1" width="3" height="12" rx=".8"/></svg>
              <svg viewBox="0 0 18 13" fill="#fff"><path d="M9 11.2a1.6 1.6 0 1 0 0 .01ZM5.6 8.4a4.8 4.8 0 0 1 6.8 0l-1.2 1.2a3.1 3.1 0 0 0-4.4 0ZM2.8 5.6a8.8 8.8 0 0 1 12.4 0l-1.2 1.2a7.1 7.1 0 0 0-10 0ZM0 2.8a12.8 12.8 0 0 1 18 0l-1.2 1.2a11 11 0 0 0-15.6 0Z"/></svg>
              <svg viewBox="0 0 28 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#fff" stroke-opacity=".5"/><rect x="2.5" y="2.5" width="19" height="8" rx="2" fill="#fff"/><path d="M25.5 4.5v4a2 2 0 0 0 0-4Z" fill="#fff" fill-opacity=".5"/></svg>
            </span>
          </div>
          <iframe id="app" src="app.html?sat=48" title="ورق — کتاب‌خوان" allow="autoplay; fullscreen"></iframe>
        </div>
      </div>
    </div>
  </div>
  <script>
    const tick = () => { const d = new Date(); document.getElementById('clock').textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); };
    tick(); setInterval(tick, 15000);
    // fit the phone to narrow screens
    const fit = () => { const k = Math.min(1, (innerWidth - 40) / 393, (innerHeight - 40) / 880); const w = document.querySelector('.phone-scale'); w.style.transform = `scale(${k})`; w.style.height = 852 * k + 'px'; };
    fit(); addEventListener('resize', fit);
  </script>
</body>
</html>
